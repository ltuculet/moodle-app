{% extends "base.html" %}

{% block title %}Iniciar Sesión - Descargador Moodle{% endblock %}

{% block content %}
<div class="login-container">
    <h2><i class="fas fa-user-lock"></i> Acceso a Moodle</h2>
    <p class="text-muted text-center mb-4">
        Ingresa tus credenciales para <strong class="text-primary">{{ moodle_base_url | replace("https://", "") | replace("http://", "") }}</strong>
    </p>
    <form method="POST" action="{{ url_for('login_moodle') }}">
        <div class="form-group">
            <label for="username">Nombre de Usuario:</label>
            <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">
            <i class="fas fa-sign-in-alt"></i> Ingresar
        </button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('reset_config') }}" class="btn btn-link btn-sm">
            <i class="fas fa-cog"></i> Cambiar URL de Moodle
        </a>
    </div>
</div>
{% endblock %}
